name: Dvorak
rows:
  - letters:
    - {type: case, normal: "'", shifted: "\"", swipeLetter: "'", shiftLocked: "'"}
    - {type: case, normal: ",", shifted: "<", shiftLocked: ","}
    - {type: case, normal: ".", shifted: ">", shiftLocked: "."}
    - p
    - y
    - f
    - g
    - c
    - r
    - l
  - letters: a o e u i d h t n s
  - letters: $shift j k x b m w v $delete
  - bottom:  $symbols q $action $space z $enter