name: "toki pona (divided)"
languages: tok

description: A simple Toki Pona keyboard, created by jan Jelipe.

autoShift: false
rowHeightMode: FillHeight

rows:
  - letters:
    - { type: case, normal: "?", shifted: "[" }
    - i 
    - u
    - e
    - { type: base, spec: "p", hint: "b", moreKeys: "b" }
    - { type: base, spec: "m", hint: "h", moreKeys: "h" }
    - { type: base, spec: "w", hint: "f v", moreKeys: "f,v" }
    - { type: base, spec: "t", hint: "d", moreKeys: "d" }
    - { type: case, normal: "!", shifted: "]"}
  - letters:
    - o
    - a
    - { type: base, spec: "n", hint: "&", moreKeys: "&" }
    - { type: base, spec: "s", hint: "x z", moreKeys: "x,z" }
    - { type: base, spec: "l", hint: "r", moreKeys: "r" }
    - { type: base, spec: "k", hint: "q c g", moreKeys: "c,g,q" }
    - { type: base, spec: "j", hint: "y", moreKeys: "y" }
