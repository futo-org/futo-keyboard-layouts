name: Itelmen
languages: itl
minimumFunctionalKeyWidth: 0.0
combiners:
  - DeadKeyPreCombiner
  - DeadKey
rows:
  - letters:
    - { type: base, spec: "ё", attributes: { width: Grow } }
    - { type: base, spec: "ԓ", attributes: { width: Grow } }
    - { type: base, spec: "љ", attributes: { width: Grow } }
    - { type: base, spec: "ӄ", attributes: { width: Grow } }
    - { type: base, spec: "ә", attributes: { width: Grow } }
    - { type: base, spec: "ӈ", attributes: { width: Grow } }
    - { type: base, spec: "њ", attributes: { width: Grow } }
    # U+0306 ◌̆ COMBINING BREVE
    - { type: base, spec: "˘|\u0306", attributes: { width: Grow } }
    - { type: base, spec: "ӽ", attributes: { width: Grow } }
    - { type: base, spec: "ъ", attributes: { width: Grow } }
  - letters: й ц у к е н г ш щ з х
  - letters: ф ы в а п р о л д ж э
  - letters: $shift я ч с м и т ь б ю $delete
  - bottom:
    - $symbols
    - ','
    - $action
    - $space
    - "'"
    - '.'
    - $enter
